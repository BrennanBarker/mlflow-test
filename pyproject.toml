[project]
name = "judge-eval"
version = "0.1.0"
description = "Generate a labeled faithfulness-judge dataset and evaluate judges against it."
requires-python = ">=3.11"
dependencies = [
    "litellm",
    "mlflow",
    "openai",
    "pandas",
    "pyarrow",
    "pydantic",
]

[project.scripts]
judge-eval = "judge_eval.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
